<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Mt. Moriah MBC - Tutoring Program Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              crimson: '#800020',
              gold: '#D4AF37',
              dark: '#111827'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Church Header -->
  <header class="w-full bg-brand-dark text-white py-6 px-4 shadow-lg border-b-4 border-brand-gold flex flex-col items-center text-center">
    <img 
      src="https://drive.google.com/thumbnail?id=1dn4jp6zvWGfJ9BCwM0bSdXydaGDGf0PM&sz=w1000" 
      alt="New Mt. Moriah Missionary Baptist Church" 
      class="w-full max-w-xs md:max-w-md h-auto object-contain mb-3"
    >
    <h1 class="text-2xl md:text-3xl font-serif font-bold text-brand-gold tracking-wide">Youth Academic Tutoring Program</h1>
    <p class="text-gray-300 text-sm md:text-base mt-1">Registration Portal</p>
  </header>

  <!-- Registration Form Container -->
  <main class="max-w-3xl w-full mx-auto p-4 md:p-8 my-6 flex-1">
    <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
      
      <div class="bg-brand-crimson text-white px-6 py-4">
        <h2 class="text-xl font-bold font-serif">Parent & Student Information</h2>
        <p class="text-xs text-red-100">Please complete all required fields below.</p>
      </div>

      <form id="registrationForm" class="p-6 space-y-6">
        
        <!-- Parent/Guardian Section -->
        <div class="space-y-4 border-b border-gray-200 pb-6">
          <h3 class="text-lg font-semibold text-brand-crimson">Parent / Guardian Details</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Parent/Guardian Name *</label>
              <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none">
            </div>
            
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
              <input type="tel" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
            <input type="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none">
          </div>
        </div>

        <!-- Student Dynamic Section -->
        <div id="studentsContainer" class="space-y-6">
          <div class="student-entry bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4 relative">
            <div class="flex justify-between items-center border-b border-gray-200 pb-2">
              <h4 class="font-semibold text-brand-dark student-title">Student 1</h4>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Student Full Name *</label>
                <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Grade Level *</label>
                <select required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
                  <option value="">Select...</option>
                  <option value="K">Kindergarten</option>
                  <option value="1">1st Grade</option>
                  <option value="2">2nd Grade</option>
                  <option value="3">3rd Grade</option>
                  <option value="4">4th Grade</option>
                  <option value="5">5th Grade</option>
                  <option value="6">6th Grade</option>
                  <option value="7">7th Grade</option>
                  <option value="8">8th Grade</option>
                  <option value="9">9th Grade</option>
                  <option value="10">10th Grade</option>
                  <option value="11">11th Grade</option>
                  <option value="12">12th Grade</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Subjects Needing Assistance *</label>
              <input type="text" placeholder="e.g. Math, Reading, Science" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
            </div>
          </div>
        </div>

        <!-- Add Student Action Button -->
        <div>
          <button type="button" id="addStudentBtn" class="w-full md:w-auto px-4 py-2 bg-amber-100 text-amber-900 border border-amber-300 font-semibold rounded-lg hover:bg-amber-200 transition flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add Another Student
          </button>
        </div>

        <!-- Submission Buttons -->
        <div class="pt-4 border-t border-gray-200">
          <button type="submit" class="w-full bg-brand-crimson hover:bg-red-900 text-white font-bold py-3 rounded-lg shadow transition duration-200 text-lg">
            Complete Registration
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full bg-brand-dark text-gray-400 py-4 text-center text-xs border-t border-gray-800">
    <p>&copy; New Mt. Moriah Missionary Baptist Church. All rights reserved.</p>
  </footer>

  <!-- Interactive JavaScript -->
  <script>
    let studentCount = 1;

    document.getElementById('addStudentBtn').addEventListener('click', function() {
      studentCount++;
      const container = document.getElementById('studentsContainer');
      
      const newCard = document.createElement('div');
      newCard.className = 'student-entry bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4 relative';
      newCard.innerHTML = `
        <div class="flex justify-between items-center border-b border-gray-200 pb-2">
          <h4 class="font-semibold text-brand-dark student-title">Student ${studentCount}</h4>
          <button type="button" class="remove-btn text-xs text-red-600 hover:text-red-800 font-semibold">Remove</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Student Full Name *</label>
            <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Grade Level *</label>
            <select required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
              <option value="">Select...</option>
              <option value="K">Kindergarten</option>
              <option value="1">1st Grade</option>
              <option value="2">2nd Grade</option>
              <option value="3">3rd Grade</option>
              <option value="4">4th Grade</option>
              <option value="5">5th Grade</option>
              <option value="6">6th Grade</option>
              <option value="7">7th Grade</option>
              <option value="8">8th Grade</option>
              <option value="9">9th Grade</option>
              <option value="10">10th Grade</option>
              <option value="11">11th Grade</option>
              <option value="12">12th Grade</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Subjects Needing Assistance *</label>
          <input type="text" placeholder="e.g. Math, Reading, Science" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold focus:border-transparent outline-none bg-white">
        </div>
      `;

      container.appendChild(newCard);

      // Add Remove Listener
      newCard.querySelector('.remove-btn').addEventListener('click', function() {
        newCard.remove();
        reindexStudents();
      });
    });

    function reindexStudents() {
      const cards = document.querySelectorAll('.student-entry');
      studentCount = cards.length;
      cards.forEach((card, idx) => {
        card.querySelector('.student-title').textContent = `Student ${idx + 1}`;
      });
    }

    // Form Submission Handling
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Registration submitted successfully!');
    });
  </script>

</body>
</html>
