<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - New Mt. Moriah Missionary Baptist Church</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              crimson: '#800020',
              dark: '#1A1A1A'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center">

  <!-- Header Section -->
  <header class="w-full bg-brand-dark text-white py-6 px-4 shadow-md flex flex-col items-center border-b-4 border-brand-gold">
    <img 
      src="https://drive.google.com/thumbnail?id=1dn4jp6zvWGfJ9BCwM0bSdXydaGDGf0PM&sz=w1000" 
      alt="New Mt. Moriah Missionary Baptist Church" 
      class="w-full max-w-xs md:max-w-md h-auto object-contain mb-2"
    >
  </header>

  <!-- Form Container -->
  <main class="w-full max-w-4xl px-4 py-8 flex-1 flex flex-col items-center">
    <div class="w-full bg-white rounded-lg shadow-lg p-2 md:p-6 border border-gray-200">
      <iframe 
        src="https://docs.google.com/forms/d/e/1FAIpQLSe84PdOTTTQd69GHtOjP0mRSuiX_Gtl1iDYce2-46pP-E5NBw/viewform?embedded=true" 
        class="w-full h-[800px] md:h-[1000px] border-0" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0">
        Loading…
      </iframe>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="w-full bg-brand-dark text-gray-300 py-4 text-center text-sm border-t border-gray-800">
    <p>&copy; New Mt. Moriah Missionary Baptist Church. All rights reserved.</p>
  </footer>

</body>
</html>
